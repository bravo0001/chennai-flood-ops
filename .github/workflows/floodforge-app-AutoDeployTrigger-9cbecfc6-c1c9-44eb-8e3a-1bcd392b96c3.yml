name: Trigger auto deployment for floodforge-app

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/floodforge-app-AutoDeployTrigger-9cbecfc6-c1c9-44eb-8e3a-1bcd392b96c3.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.FLOODFORGEAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.FLOODFORGEAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.FLOODFORGEAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: floodforge.azurecr.io
          registryUsername: ${{ secrets.FLOODFORGEAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.FLOODFORGEAPP_REGISTRY_PASSWORD }}
          containerAppName: floodforge-app
          resourceGroup: floodforge-rg
          imageToBuild: floodforge.azurecr.io/floodforge-app:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


